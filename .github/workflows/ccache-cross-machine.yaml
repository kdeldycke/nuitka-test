---
"on":
  push:
    branches:
      - main
  workflow_dispatch:

# Reproduce https://github.com/Nuitka/Nuitka/issues/3996
#
# Nuitka derives its `-I` flags from wherever it is installed. An ephemeral uv
# environment resolves that location to `{uv cache}/archive-v0/{random}/`, and
# the random segment changes on every extraction. The compiler command line
# changes with it, so ccache computes a different key and never matches an
# entry an earlier extraction wrote.
#
# The install form is what decides whether the bug appears. `uv venv` plus
# `uv pip install` copies Nuitka into the virtual environment, whose path is
# stable across runs, and never reproduces this. Both jobs below install the
# way the report did, through an ephemeral environment, so Nuitka is imported
# straight out of the uv cache.
#
# `path-change` isolates the variable on one machine. Its last three builds
# test `base_dir`, the remedy the report suggested. `cross-machine` is the
# case the issue title names: two runners sharing one ccache directory.
#
# Each job takes the Nuitka version from its `nuitka` matrix axis. The fix is
# https://github.com/Nuitka/Nuitka/commit/381a18f17ecef962c05cbf5d456ec84f04cb78e6:
# it links the include directories into the build directory under stable
# names. On that commit, every build from a new install path hit all of its
# files, where 4.3 missed all of them:
# https://github.com/kdeldycke/nuitka-test/actions/runs/39437356431
#
# 4.3.4 is the newest release and does not carry the fix. The `4.4rc5` cell is
# the pre-release commit of `develop`, which does.

# Hold every install to the cooldown: nothing uploaded in the last week
# resolves. Each command installing Nuitka exempts that one package, for a
# release younger than the window, and leaves its dependencies gated. A git
# source carries no upload date, so the cooldown does not apply to it.
env:
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  # Three builds, one ccache, one machine. Build 2 repeats build 1 with the
  # same uv cache and is the control: it proves ccache works at all here. Only
  # build 3 changes the install path, so it is the only candidate explanation
  # left when it misses. Builds 1 to 3 keep every other ccache setting at its
  # default, `compiler_check = mtime` included, as a local build would.
  #
  # Builds 4 to 6 repeat the test with `base_dir` set to the workspace, which
  # holds the uv cache and the build directory. Build 4 reuses the install
  # path of build 2, so `base_dir` is the only change: it rewrites every key,
  # nothing hits, and that proves the setting is in effect. Build 5 is the
  # control. Build 6 follows a new extraction into the same uv cache
  # directory, so the random segment is the only part of the path that differs.
  path-change:
    name: same machine, new uv extraction / ${{ matrix.os }} / Nuitka ${{ matrix.nuitka.label }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26          # arm64, the platform of the report
          - ubuntu-24.04      # x86, control: the mechanism is not macOS-specific
        # `base_dir: false` skips builds 4 to 6: a version that carries the fix
        # needs no remedy.
        nuitka:
          - label: "4.3.4"
            requirement: "nuitka==4.3.4"
            base_dir: true
          - label: "4.4rc5"
            requirement: "nuitka @ git+https://github.com/Nuitka/Nuitka@f074b08d4fbccf5d36244b23356fe7365c5f4941"
            base_dir: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/shared-ccache
      NUITKA_CACHE_DIR: ${{ github.workspace }}/nuitka-cache
      NUITKA_REQUIREMENT: ${{ matrix.nuitka.requirement }}
      BASE_DIR_BUILDS: ${{ matrix.nuitka.base_dir }}
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.13"
      # Nuitka downloads ccache on macOS and Windows. On Linux it expects the
      # OS package, and the runner image ships without one, which leaves the
      # job with nothing to measure.
      - &install-ccache-linux
        name: Install ccache - Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get --quiet update
          sudo apt-get --quiet --yes --no-install-recommends install ccache
      - name: Create the reproducer
        run: |
          printf 'print("hello world")\n' > hello.py
      - name: Build and compare ccache keys
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          def fail(message):
              """Report a verdict on stdout, so it lands after the evidence it refers to.

              `sys.exit(message)` writes to stderr, which the Actions log interleaves
              ahead of buffered stdout, putting the conclusion before its own reasons.
              """
              print(message)
              sys.stdout.flush()
              sys.exit(1)

          NUITKA = os.environ["NUITKA_REQUIREMENT"]
          RESULT = re.compile(r"result '(cache hit|cache miss)': (\d+)")
          # An include path into the install, or into the stable links the fix
          # creates in the build directory.
          INCLUDE = re.compile(r"-I(\S*(?:site-packages/nuitka|stable_includes)\S*)")

          def run(argv, uv_cache, extra_env=None):
              env = dict(os.environ)
              env["UV_CACHE_DIR"] = str(uv_cache)
              env.update(extra_env or {})
              return subprocess.run(
                  ["uv", "--no-progress", "run", "--no-project", "--python", "3.13",
                   "--exclude-newer-package", "nuitka=P0D", "--with", NUITKA, "--"] + argv,
                  env=env, capture_output=True, text=True, encoding="UTF-8",
              )

          def build(number, uv_cache, extra_env=None):
              where = run(["python", "-c", "import nuitka; print(nuitka.__file__)"], uv_cache, extra_env)
              location = where.stdout.strip()
              if where.returncode != 0 or not location:
                  print(where.stderr, file=sys.stderr)
                  fail(f"build #{number}: Nuitka could not be installed or imported")

              for leftover in ("hello.build", "hello.dist"):
                  shutil.rmtree(leftover, ignore_errors=True)

              print(f"::group::build #{number} from {location}")
              sys.stdout.flush()
              proc = run(
                  ["python", "-m", "nuitka", "--mode=standalone", "--assume-yes-for-downloads", "hello.py"],
                  uv_cache,
                  extra_env,
              )
              print(proc.stdout)
              print(proc.stderr, file=sys.stderr)
              print("::endgroup::")
              if proc.returncode != 0:
                  fail(f"build #{number} failed")

              # Nuitka reports the ccache tally on stderr, not stdout.
              counts = {kind: int(value) for kind, value in RESULT.findall(proc.stdout + proc.stderr)}

              # The ccache log records the command line ccache actually hashed,
              # so an include path that moved is visible in it.
              includes = set()
              for log in Path("hello.build").glob("ccache-*.txt"):
                  for line in log.read_text(encoding="UTF-8", errors="replace").splitlines():
                      includes.update(INCLUDE.findall(line))

              hits = counts.get("cache hit", 0)
              misses = counts.get("cache miss", 0)
              print(f"build #{number}: {hits} hit(s), {misses} miss(es)")
              print(f"  nuitka imported from: {location}")
              for name, value in sorted((extra_env or {}).items()):
                  print(f"  {name}={value}")
              for include in sorted(includes)[:3]:
                  print(f"  -I{include}")
              sys.stdout.flush()
              return {"location": location, "hits": hits, "misses": misses, "includes": sorted(includes)}

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          cache_a = workspace / "uv-cache-a"
          cache_b = workspace / "uv-cache-b"

          first = build(1, cache_a)                 # Cold ccache: every file misses.
          second = build(2, cache_a)                # Same install path: the control.
          third = build(3, cache_b)                 # New extraction, nothing else changed.

          test_base_dir = os.environ["BASE_DIR_BUILDS"] == "true"
          if test_base_dir:
              # `base_dir` makes ccache hash every path below it as a relative
              # path. The workspace holds the uv cache and the build directory.
              based = {"CCACHE_BASEDIR": str(workspace)}
              fourth = build(4, cache_a, based)     # Install path of build 2: only the keys change.
              fifth = build(5, cache_a, based)      # Same again: the control.
              shutil.rmtree(cache_a)
              sixth = build(6, cache_a, based)      # New extraction, same uv cache directory.

          print("\n" + "=" * 70)
          same_path = first["location"] == second["location"]
          moved = second["location"] != third["location"]
          print(f"build 1 and 2 share an install path: {same_path}")
          print(f"build 3 was extracted elsewhere:     {moved}")
          sys.stdout.flush()

          if not moved:
              fail("\nThe second uv cache reused the first extraction, so nothing was tested.")
          if second["hits"] == 0:
              fail("\nThe control build missed too: ccache is not working here, so the test is void.")

          print(f"\ncontrol build 2 (same path):  {second['hits']} hit(s), {second['misses']} miss(es)")
          print(f"build 3 (path moved):         {third['hits']} hit(s), {third['misses']} miss(es)")
          sys.stdout.flush()

          verdicts = []
          if third["hits"] == 0:
              verdicts.append(
                  f"Every one of the {third['misses']} file(s) missed after the install path moved, "
                  f"while the identical build 2 scored {second['hits']} hit(s)."
              )

          if test_base_dir:
              print(f"\nwith base_dir = {workspace}:")
              print(f"build 4 (new keys):           {fourth['hits']} hit(s), {fourth['misses']} miss(es)")
              print(f"control build 5 (same path):  {fifth['hits']} hit(s), {fifth['misses']} miss(es)")
              print(f"build 6 (new extraction):     {sixth['hits']} hit(s), {sixth['misses']} miss(es)")
              print(f"build 5 imported nuitka from: {fifth['location']}")
              print(f"build 6 imported nuitka from: {sixth['location']}")
              sys.stdout.flush()

              if fourth["location"] != second["location"]:
                  fail("\nBuild 4 did not reuse the install path of build 2, so it cannot show what `base_dir` changes.")
              if fourth["hits"] != 0:
                  fail("\nBuild 4 hit entries written without `base_dir`: the setting has no effect, so its test is void.")
              if fifth["hits"] == 0:
                  fail("\nThe control build 5 missed too: ccache is not working with `base_dir`, so its test is void.")
              if fifth["location"] == sixth["location"]:
                  fail("\nThe emptied uv cache gave the same extraction name again, so `base_dir` was not tested.")
              if sixth["hits"] == 0:
                  verdicts.append(
                      f"Every one of the {sixth['misses']} file(s) missed after a new extraction with `base_dir` set, "
                      f"while the identical build 5 scored {fifth['hits']} hit(s)."
                  )

          if verdicts:
              fail("\n" + "\n".join(verdicts))
          print("\nThe moved install path still hit the cache.")
          PY

  # The case the issue title names. One runner writes the cache, a second
  # runner reads it, and the two never share a uv extraction.
  #
  # `compiler_check` decides how ccache identifies the compiler. `mtime`, the
  # default, hashes the size and mtime of the compiler file, and `content`
  # hashes its bytes. Each runner reports the size and mtime of the compiler
  # ccache ran, which is what the `mtime` check compares.
  cross-machine-seed:
    name: >-
      cross-machine, runner 1 writes the cache / ${{ matrix.os }} / Nuitka ${{ matrix.nuitka.label }}
      / ${{ matrix.compiler_check }}
    strategy: &cross-machine-strategy
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
        nuitka:
          - label: "4.3.4"
            requirement: "nuitka==4.3.4"
          - label: "4.4rc5"
            requirement: "nuitka @ git+https://github.com/Nuitka/Nuitka@f074b08d4fbccf5d36244b23356fe7365c5f4941"
        compiler_check:
          - content
          - mtime
        # Without the fix, the install path alone makes every file miss, so the
        # compiler check has nothing to change.
        exclude:
          - nuitka:
              label: "4.3.4"
              requirement: "nuitka==4.3.4"
            compiler_check: mtime
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/shared-ccache
      CCACHE_COMPILERCHECK: ${{ matrix.compiler_check }}
      NUITKA_REQUIREMENT: ${{ matrix.nuitka.requirement }}
      COMPILER_REPORT: seed-compiler.txt
    steps:
      # No uv cache is restored or saved, so each runner extracts Nuitka into
      # a directory of its own.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.13"
          enable-cache: false
      - *install-ccache-linux
      - name: Create the reproducer
        run: |
          printf 'print("hello world")\n' > hello.py
      - name: Build
        run: >
          uv --no-progress run --no-project --python 3.13 --exclude-newer-package nuitka=P0D --with "${NUITKA_REQUIREMENT}" --
          python -m nuitka --mode=standalone --assume-yes-for-downloads hello.py
      - name: Report where Nuitka was imported from
        run: |
          uv --no-progress run --no-project --python 3.13 --exclude-newer-package nuitka=P0D --with "${NUITKA_REQUIREMENT}" -- \
            python -c "import nuitka; print(nuitka.__file__)" | tee seed-location.txt
      - &report-compiler
        name: Report the compiler ccache ran
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          compilers = set()
          for log in Path("hello.build").glob("ccache-*.txt"):
              for line in log.read_text(encoding="UTF-8", errors="replace").splitlines():
                  # ccache logs its own argv: its binary, then the compiler it runs.
                  if "Command line: " in line:
                      compilers.add(line.split("Command line: ", 1)[1].split()[1])

          identities = []
          for compiler in sorted(compilers):
              stat = os.stat(compiler)
              identities.append(
                  f"{compiler} ({os.path.realpath(compiler)}): "
                  f"{stat.st_size} bytes, mtime {stat.st_mtime_ns} ns"
              )
              print(identities[-1])
              # On macOS, the compilers in `/usr/bin` are shims: each runs the
              # tool of the selected developer directory, which `xcrun` names.
              if shutil.which("xcrun"):
                  tool = subprocess.run(
                      ["xcrun", "--find", os.path.basename(compiler)],
                      capture_output=True, text=True, encoding="UTF-8",
                  ).stdout.strip()
                  if tool:
                      print(f"  xcrun runs {tool}: {os.stat(tool).st_size} bytes")
          Path(os.environ["COMPILER_REPORT"]).write_text("\n".join(identities) + "\n", encoding="UTF-8")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shared-ccache-${{ matrix.os }}-${{ matrix.nuitka.label }}-${{ matrix.compiler_check }}
          path: |
            shared-ccache
            seed-location.txt
            seed-compiler.txt
          include-hidden-files: true
          retention-days: 1

  cross-machine-reuse:
    name: >-
      cross-machine, runner 2 reads the cache / ${{ matrix.os }} / Nuitka ${{ matrix.nuitka.label }}
      / ${{ matrix.compiler_check }}
    needs: cross-machine-seed
    # A failed seed of one cell must not skip the other cells.
    if: ${{ !cancelled() }}
    strategy: *cross-machine-strategy
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/shared-ccache
      CCACHE_COMPILERCHECK: ${{ matrix.compiler_check }}
      NUITKA_REQUIREMENT: ${{ matrix.nuitka.requirement }}
      COMPILER_REPORT: reuse-compiler.txt
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.13"
          enable-cache: false
      - *install-ccache-linux
      # Restores `shared-ccache/`, `seed-location.txt` and `seed-compiler.txt`
      # into the workspace.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: shared-ccache-${{ matrix.os }}-${{ matrix.nuitka.label }}-${{ matrix.compiler_check }}
      - name: Create the reproducer
        run: |
          printf 'print("hello world")\n' > hello.py
      - name: Report where Nuitka was imported from
        run: |
          uv --no-progress run --no-project --python 3.13 --exclude-newer-package nuitka=P0D --with "${NUITKA_REQUIREMENT}" -- \
            python -c "import nuitka; print(nuitka.__file__)" | tee reuse-location.txt
      - name: Build against the other runner's cache
        run: |
          uv --no-progress run --no-project --python 3.13 --exclude-newer-package nuitka=P0D --with "${NUITKA_REQUIREMENT}" -- \
            python -m nuitka --mode=standalone --assume-yes-for-downloads hello.py 2>&1 | tee build.log
      - *report-compiler
      - name: Check the cache was reused
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          def fail(message):
              """Report a verdict on stdout, so it lands after the evidence it refers to.

              `sys.exit(message)` writes to stderr, which the Actions log interleaves
              ahead of buffered stdout, putting the conclusion before its own reasons.
              """
              print(message)
              sys.stdout.flush()
              sys.exit(1)

          seed = Path("seed-location.txt").read_text(encoding="UTF-8").strip()
          reuse = Path("reuse-location.txt").read_text(encoding="UTF-8").strip()
          print(f"runner 1 imported nuitka from: {seed}")
          print(f"runner 2 imported nuitka from: {reuse}")
          if seed == reuse:
              fail("\nBoth runners imported Nuitka from the same path, so nothing was tested.")

          print(f"\nCCACHE_COMPILERCHECK={os.environ['CCACHE_COMPILERCHECK']}")
          print("runner 1 compiler: " + Path("seed-compiler.txt").read_text(encoding="UTF-8").strip())
          print("runner 2 compiler: " + Path("reuse-compiler.txt").read_text(encoding="UTF-8").strip())

          log = Path("build.log").read_text(encoding="UTF-8", errors="replace")
          counts = {kind: int(value) for kind, value in re.findall(r"result '(cache hit|cache miss)': (\d+)", log)}
          hits = counts.get("cache hit", 0)
          misses = counts.get("cache miss", 0)
          print(f"\n{hits} hit(s), {misses} miss(es) against the cache the first runner wrote")
          sys.stdout.flush()

          if hits == 0:
              fail(f"\nEvery one of the {misses} file(s) missed on a second runner sharing the same ccache.")
          print("\nThe second runner reused the cache.")
          PY
