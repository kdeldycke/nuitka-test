---
# TEMPORARY probe workflow, to be deleted once the install of Nuitka into the
# project venv is measured for kdeldycke/repomatic.
#
# repomatic's tool runner layers Nuitka over the project venv with
# `uv run --with`. uv keeps that layer in a directory of its cache that it
# names at random, and the name ends in the `-I` flags ccache hashes. A runner
# that starts from an empty uv cache therefore misses every C file, even with
# the compile cache of the build before it.
#
# `repomatic-venv-install.patch` holds the candidate change: the tool runner
# installs Nuitka into the project venv, whose path is the same on every
# runner. Each `patched` job applies it to the repomatic commit named below,
# then runs the steps of the `compile-binaries` job of repomatic's
# `_release-engine.yaml`. Each `baseline` job runs the same steps on the
# commit as it is.
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/repomatic-venv-install-probe.yaml
      - repomatic-venv-install.patch
  workflow_dispatch:

env:
  # Hold every install to the cooldown. Nuitka 4.3 is younger than the window:
  # repomatic's `pyproject.toml` exempts that one package.
  UV_EXCLUDE_NEWER: "1 week"
  # The repomatic commit the patch was cut from.
  REPOMATIC_REF: 004278a2f44795c10b633d102e067a3b178caabf

jobs:

  # Two questions.
  #
  # Does the patched runner still build a working binary on every release
  # target? The six `patched` cells answer.
  #
  # Does it give the next runner a compile cache it can use? The two
  # `linux-arm64` cells keep their compile cache for the `reuse` job below.
  build:
    name: build / ${{ matrix.variant }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Copied from `NUITKA_BUILD_TARGETS` in repomatic/release/binary.py.
        include:
          - variant: patched
            target: linux-arm64
            os: ubuntu-26.04-arm
            platform_id: linux
            extension: bin
            container: "quay.io/pypa/manylinux_2_28_aarch64\
              @sha256:e7035406e58d96b7407246af1f6514a3cbd753a0025b42b9adfbeadd3b29ba80"
          # The control of the `reuse` job: the same build, without the patch.
          - variant: baseline
            target: linux-arm64
            os: ubuntu-26.04-arm
            platform_id: linux
            extension: bin
            container: "quay.io/pypa/manylinux_2_28_aarch64\
              @sha256:e7035406e58d96b7407246af1f6514a3cbd753a0025b42b9adfbeadd3b29ba80"
          - variant: patched
            target: linux-x64
            os: ubuntu-26.04
            platform_id: linux
            extension: bin
            container: "quay.io/pypa/manylinux_2_28_x86_64\
              @sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8"
          - variant: patched
            target: macos-arm64
            os: macos-26
            platform_id: macos
            extension: bin
            floor: "11.0"
          - variant: patched
            target: macos-x64
            os: macos-26-intel
            platform_id: macos
            extension: bin
            floor: "10.15"
          - variant: patched
            target: windows-arm64
            os: windows-11-arm
            platform_id: windows
            extension: exe
          - variant: patched
            target: windows-x64
            os: windows-2025
            platform_id: windows
            extension: exe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: repomatic
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CCACHE_DIR: ${{ github.workspace }}/.nuitka-cache/ccache
      CCACHE_COMPILERCHECK: content
      BIN_NAME: repomatic-probe-${{ matrix.target }}.${{ matrix.extension }}
      VARIANT: ${{ matrix.variant }}
      # The repomatic checkout is not owned by the user the container runs as.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kdeldycke/repomatic
          ref: ${{ env.REPOMATIC_REF }}
          path: repomatic
      # The patch is read out of the object store, not from the working tree:
      # a Windows checkout rewrites the line endings of the working-tree copy.
      - name: Apply the candidate change
        if: matrix.variant == 'patched'
        run: git -C .. show HEAD:repomatic-venv-install.patch | git apply --verbose
      # No uv cache is restored or saved: each job starts from an empty one, as
      # a runner does after a change to `pyproject.toml` or `uv.lock`.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      # The same lines as the `Prepare Nuitka cache` step of the release
      # workflow.
      - name: Prepare Nuitka cache
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .nuitka-cache/ccache
          printf 'compiler_check = content\n' > .nuitka-cache/ccache/ccache.conf
          printf 'base_dir = %s\n' "$(dirname "${RUNNER_WORKSPACE}")" \
            >> .nuitka-cache/ccache/ccache.conf
          cat .nuitka-cache/ccache/ccache.conf
      # The release workflow tolerates a missing ccache. This probe measures
      # ccache, so a failed install must fail the job.
      - name: Install ccache in container
        if: matrix.container
        run: |
          dnf install --assumeyes --quiet epel-release
          dnf install --assumeyes --quiet ccache
          ccache --version | head -1
      - name: Setup venv
        run: >
          uv --no-progress
          ${{ matrix.platform_id != 'windows' && '--managed-python' || '' }}
          venv --python 3.14
      - name: Pre-bake build metadata
        run: uvx --no-progress 'click-extra==9.4.1' prebake all

      - name: Build binary
        env:
          NUITKA_CCACHE_FLAG: >-
            ${{ matrix.platform_id == 'macos' && '--disable-ccache' || '' }}
          MACOSX_DEPLOYMENT_TARGET: >-
            ${{ matrix.platform_id == 'macos' && matrix.floor || '' }}
        run: |
          set -o pipefail
          # NUITKA_CCACHE_FLAG holds an optional flag, meant to word-split.
          # shellcheck disable=SC2086
          uv --no-progress run --frozen -- repomatic --verbosity INFO run nuitka -- \
            ${NUITKA_CCACHE_FLAG} \
            --project-name=repomatic \
            --main-entry-point=repomatic=repomatic.__main__:main \
            --output-filename="${BIN_NAME}" 2>&1 | tee build.log
      - name: Upload Nuitka crash report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nuitka-crash-report-${{ matrix.variant }}-${{ matrix.target }}
          if-no-files-found: ignore
          path: repomatic/nuitka-crash-report.xml

      # Each claim is read off the command lines the tool runner logs, so a
      # build that ran the other code path cannot pass.
      - name: "Gate: the tool runner took the expected install path"
        run: |
          if [[ "${VARIANT}" == "patched" ]]; then
            grep -- "pip install --python" build.log
            grep -- "run --frozen --no-sync -- python -m nuitka" build.log | cut -c1-120
            if grep -q -- "--with nuitka" build.log; then
              echo "The patched runner still layered Nuitka with --with."
              exit 1
            fi
          else
            grep -- "run --frozen --with nuitka" build.log | cut -c1-120
            if grep -q -- "pip install --python" build.log; then
              echo "The baseline runner installed Nuitka into the venv."
              exit 1
            fi
          fi
      - name: "Gate: Nuitka is imported from the project venv"
        if: matrix.variant == 'patched'
        run: |
          uv --no-progress run --frozen --no-sync -- python - <<'PY'
          import sys
          from pathlib import Path

          import nuitka

          location = Path(nuitka.__file__).resolve()
          venv = Path(".venv").resolve()
          print(f"nuitka imported from: {location}")
          print(f"project venv:         {venv}")
          sys.stdout.flush()
          if venv not in location.parents:
              print("Nuitka is not inside the project venv.")
              sys.exit(1)
          PY

      - name: Nuitka cache stats
        working-directory: ${{ github.workspace }}
        run: du -sm .nuitka-cache/* 2>/dev/null || echo "No Nuitka cache dir."
      - name: Keep the compile cache for the reuse job
        if: matrix.target == 'linux-arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nuitka-cache-${{ matrix.variant }}
          path: .nuitka-cache
          include-hidden-files: true
          retention-days: 1

      - name: Verify binary architecture and OS floor
        env:
          TARGET: ${{ matrix.target }}
        run: >
          uv --no-progress run --frozen -- repomatic
          verify-binary --target "${TARGET}" --binary "${BIN_NAME}"
      - name: "Gate: the binary starts and reports its own name"
        run: |
          "./${BIN_NAME}" --version | tee version.txt
          grep -q "^repomatic, version 7\." version.txt
      - name: Self-test binary
        env:
          PYTHONIOENCODING: utf8
        run: >
          uv --no-progress run --frozen --
          click-extra test-suite
          --binary "./${BIN_NAME}"
          --jobs max

  # The question: does a second runner, with an empty uv cache, hit the
  # compile cache the first one wrote?
  #
  # `baseline` is the control. It must miss every file: that is the behavior
  # the patch is meant to remove, and a baseline that hits means this probe
  # does not model it.
  reuse:
    name: reuse / ${{ matrix.variant }}
    needs: build
    # A failed cell of another target must not skip this job.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - patched
          - baseline
    runs-on: ubuntu-26.04-arm
    container: "quay.io/pypa/manylinux_2_28_aarch64\
      @sha256:e7035406e58d96b7407246af1f6514a3cbd753a0025b42b9adfbeadd3b29ba80"
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: repomatic
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CCACHE_DIR: ${{ github.workspace }}/.nuitka-cache/ccache
      CCACHE_COMPILERCHECK: content
      BIN_NAME: repomatic-probe-linux-arm64.bin
      VARIANT: ${{ matrix.variant }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kdeldycke/repomatic
          ref: ${{ env.REPOMATIC_REF }}
          path: repomatic
      - name: Apply the candidate change
        if: matrix.variant == 'patched'
        run: git -C .. show HEAD:repomatic-venv-install.patch | git apply --verbose
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: nuitka-cache-${{ matrix.variant }}
          path: .nuitka-cache
      - name: Prepare Nuitka cache
        working-directory: ${{ github.workspace }}
        run: |
          du -sm .nuitka-cache/* 2>/dev/null || echo "No Nuitka cache dir."
          mkdir -p .nuitka-cache/ccache
          printf 'compiler_check = content\n' > .nuitka-cache/ccache/ccache.conf
          printf 'base_dir = %s\n' "$(dirname "${RUNNER_WORKSPACE}")" \
            >> .nuitka-cache/ccache/ccache.conf
      - name: Install ccache in container
        run: |
          dnf install --assumeyes --quiet epel-release
          dnf install --assumeyes --quiet ccache
          ccache --version | head -1
      - name: Setup venv
        run: uv --no-progress --managed-python venv --python 3.14
      - name: Pre-bake build metadata
        run: uvx --no-progress 'click-extra==9.4.1' prebake all
      - name: Build binary
        run: |
          set -o pipefail
          uv --no-progress run --frozen -- repomatic --verbosity INFO run nuitka -- \
            --project-name=repomatic \
            --main-entry-point=repomatic=repomatic.__main__:main \
            --output-filename="${BIN_NAME}" 2>&1 | tee build.log
      - name: "Gate: the compile cache of the first runner"
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          log = Path("build.log").read_text(encoding="UTF-8", errors="replace")
          # The first tally belongs to the main compilation. The onefile
          # bootstrap reports its single file after it.
          total = re.search(r"Compiled (\d+) C files using ccache", log)
          if not total:
              print("No ccache tally in the build log, so the test is void.")
              sys.exit(1)
          tally = log[total.end():].split("Compiled", 1)[0]
          counts = {kind: int(value) for kind, value in re.findall(r"result '(cache hit|cache miss)': (\d+)", tally)}
          hits = counts.get("cache hit", 0)
          misses = counts.get("cache miss", 0)
          variant = os.environ["VARIANT"]
          print(f"{variant}: {hits} hit(s), {misses} miss(es) of {total[1]} C files, on the cache of the first runner")
          sys.stdout.flush()

          if variant == "baseline":
              if hits:
                  print("The baseline hit the cache: this probe does not model a new uv environment, so it is void.")
                  sys.exit(1)
              print("The baseline missed every file, as the release workflow does today.")
          elif hits < int(total[1]) * 0.9:
              print("The patched runner missed more than one file in ten.")
              sys.exit(1)
          else:
              print("The patched runner reused the cache of the first runner.")
          PY
