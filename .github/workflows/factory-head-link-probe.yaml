---
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/factory-head-link-probe.yaml
  workflow_dispatch:

# TEMPORARY probe workflow, to be deleted once the question below is answered.
#
# Question: on `factory` head `b5585494`, a standalone build stops at its link
# on `undefined reference to 'constant_bin_data'`. Which builds does that reach,
# and what does the source files index that head added hold?
# Nuitka/Nuitka@b5585494a2a57672e5176b384d8c16c1e4d8e48b replaced the directory
# scan of the Scons backend with that index.
#
# Each cell runs three builds and prints what each one left behind:
#
# - `plain`: one module, no `--main-entry-point`, which separates the entry
#   point from the link.
# - `entry-point`: the shape that failed, `--project-name` plus
#   `--main-entry-point`, with no multiprocessing in it.
# - `entry-point-lto-off`: the same with `--lto=no`, which separates an LTO link
#   that drops an object from a source file nobody compiled.
#
# The measurement beside each build lists the source files on disk that the
# index does not name, and says whether `__constants.c`, which declares the
# missing symbol, and its object file are there.
#
# The `control b1e87a95` cells pin the commit below head, where the same three
# builds link. A control that does not link makes the head result void. The head
# cells stay red while the link error appears, like the other reproducers here.

# Hold every install to the cooldown: nothing uploaded in the last week
# resolves. A git source has no upload date, so the installs of Nuitka are not
# held, but their dependencies are.
env:
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  factory-head-link:
    name: link at ${{ matrix.nuitka.label }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
          - windows-2025
        nuitka:
          - label: head b5585494
            requirement: "nuitka @ git+https://github.com/Nuitka/Nuitka@b5585494a2a57672e5176b384d8c16c1e4d8e48b"
            expect: bug
          - label: control b1e87a95
            requirement: "nuitka @ git+https://github.com/Nuitka/Nuitka@b1e87a953e5a012b284411c8646d81e8b4659357"
            expect: links
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      NUITKA_EXPECT: ${{ matrix.nuitka.expect }}
      NUITKA_REQUIREMENT: ${{ matrix.nuitka.requirement }}
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.13"
      # Standalone builds on Linux need patchelf, which the runner image lacks.
      - name: Install patchelf - Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get --quiet update
          sudo apt-get --quiet --yes --no-install-recommends install patchelf
      - name: Setup venv
        run: |
          uv --no-progress venv --python 3.14
      - name: Install Nuitka
        run: |
          uv --no-progress pip install "${NUITKA_REQUIREMENT}"
      - name: nuitka --version
        run: |
          uv --no-progress run -- python -m nuitka --version

      - name: Create the reproducer
        run: |
          cat > plain.py <<'PY'
          import sys

          CITIES = {"lisbon": 38.7, "quito": -0.2}


          def main():
              print(sorted(CITIES))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          mkdir papaya
          cat > papaya/__init__.py <<'PY'
          CITIES = {"lisbon": 38.7, "quito": -0.2}
          PY
          cat > papaya/__main__.py <<'PY'
          import sys

          from papaya import CITIES


          def main():
              print(sorted(CITIES))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      # `--disable-cache=ccache` keeps Nuitka from fetching an unverified ccache
      # on macOS: https://github.com/Nuitka/Nuitka/issues/3997
      - name: Build the three targets and measure the index
        run: |
          uv --no-progress run -- python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          SYMBOL = "constant_bin_data"
          """The symbol the link reports as undefined."""

          INDEX_NAME = "source_files_index.txt"
          """The file head added, which the Scons backend reads instead of scanning."""

          COMMON = ["--mode=standalone", "--assume-yes-for-downloads", "--disable-cache=ccache"]

          BUILDS = [
              ("plain", "plain", ["plain.py"]),
              (
                  "entry-point",
                  "entry-point",
                  ["--project-name=papaya", "--main-entry-point=papaya=papaya.__main__:main"],
              ),
              (
                  "entry-point-lto-off",
                  "entry-point-lto-off",
                  ["--lto=no", "--project-name=papaya", "--main-entry-point=papaya=papaya.__main__:main"],
              ),
          ]
          """Name, output directory, and the flags that name the target."""

          KEYS = (SYMBOL, "linking with", "Undefined symbols", "scons: ***", "FATAL", "Backend C compiler")
          """The log lines a build report keeps."""

          def fail(message):
              """Report a verdict on stdout, so it lands after the evidence it refers to."""
              print(message)
              sys.stdout.flush()
              sys.exit(1)

          def build(name, output_dir, flags):
              """Run one Nuitka build, and return its exit code and its log text."""
              options = [*flags, f"--output-dir={output_dir}"]
              print(f"$ python -m nuitka {' '.join(COMMON + options)}")
              sys.stdout.flush()
              log = Path(f"{name}.log")
              # Binary mode: the child writes through the handle itself, so a text
              # wrapper of the parent would only add a buffer between them.
              with open(log, "wb") as stream:
                  code = subprocess.run(
                      [sys.executable, "-m", "nuitka", *COMMON, *options], stdout=stream, stderr=subprocess.STDOUT
                  ).returncode
              return code, log.read_text(encoding="UTF-8", errors="replace")

          def build_dir(output_dir):
              """Return the `.build` directory a standalone build wrote, if any."""
              found = sorted(Path(output_dir).glob("*.build"))
              return found[0] if found else None

          def sources_on_disk(directory):
              """Return the C and C++ sources of a build directory, named as the index names them."""
              names = set()
              for path in directory.rglob("*"):
                  if not path.is_file() or path.suffix not in (".c", ".cpp"):
                      continue
                  relative = path.relative_to(directory).as_posix()
                  # The index walks the build directory, `plugins` and `static_src` only.
                  if relative.count("/") and not relative.startswith(("plugins/", "static_src/")):
                      continue
                  names.add(relative)
              return names

          def objects(directory, stem):
              """Return the compiled objects whose name starts with `stem`."""
              return sorted(path.name for path in directory.rglob(f"{stem}*.o*") if path.is_file())

          def measure(output_dir, directory):
              """Print what one build left behind: the index, the disk, and their difference."""
              if directory is None:
                  print(f"  no .build directory under {output_dir}")
                  return
              print(f"  build directory: {directory}")
              print(f"  '__constants.c' on disk: {(directory / '__constants.c').is_file()}")
              print(f"  objects for '__constants': {objects(directory, '__constants')}")
              index = directory / INDEX_NAME
              if not index.is_file():
                  print(f"  no {INDEX_NAME}: this Nuitka writes no index")
                  return
              listed = {line.strip() for line in index.read_text(encoding="UTF-8").splitlines() if line.strip()}
              on_disk = sources_on_disk(directory)
              print(f"  {INDEX_NAME}: {len(listed)} entries; sources on disk: {len(on_disk)}")
              print(f"  '__constants.c' in the index: {'__constants.c' in listed}")
              for label, names in (
                  ("on disk but not in the index", on_disk - listed),
                  ("in the index but not on disk", listed - on_disk),
              ):
                  print(f"  {label}: {len(names)}")
                  for entry in sorted(names):
                      print(f"    {entry}")

          results = {}
          for name, output_dir, flags in BUILDS:
              code, output = build(name, output_dir, flags)
              hit = SYMBOL in output
              print(f"\n=== {name}: exit code {code}, '{SYMBOL}' in the output: {hit}")
              for line in output.splitlines():
                  if any(key in line for key in KEYS):
                      print(f"  | {line.strip()}")
              measure(output_dir, build_dir(output_dir))
              results[name] = (code, hit)
              print()
              sys.stdout.flush()

          print("=== summary")
          for name, (code, hit) in results.items():
              print(f"  {name}: exit code {code}, link error on '{SYMBOL}': {hit}")
          sys.stdout.flush()

          if os.environ["NUITKA_EXPECT"] == "links":
              broken = sorted(name for name, (code, hit) in results.items() if code != 0 or hit)
              if broken:
                  fail(f"\nThe control did not link: {', '.join(broken)}. The head result is void.")
              print("\nThe control linked all three targets.")

          code, hit = results["entry-point"]
          if code == 0 and not hit:
              fail("\nThe --main-entry-point build linked at head, so this probe reproduces nothing.")
          print(f"\nThe --main-entry-point build did not link at head, on '{SYMBOL}'.")
          PY
