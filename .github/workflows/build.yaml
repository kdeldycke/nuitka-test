---
"on":
  push:
    branches:
      - main
  workflow_dispatch:

# Reproduce https://github.com/Nuitka/Nuitka/issues/3879
#
# Each variant pairs `--main-entry-point` with a different companion option.
# The baseline builds the same package the legacy way, as a control.

# Hold every install to the cooldown: nothing uploaded in the last week
# resolves. Nuitka 4.3 is younger than that, so the command installing it
# exempts that one package and leaves its dependencies gated.
env:
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  build:
    name: ${{ matrix.variant }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm  # arm64
          - ubuntu-24.04      # x86
          - macos-26          # arm64
          - macos-15-intel    # x86
          - windows-11-arm    # arm64
          - windows-2025      # x86
        variant:
          # Bug A: `--main-entry-point` alone. 4.1 and 4.2 crashed in early
          # output-path setup. 4.3 stops with a plain error that names the
          # option it needs.
          - bug-a
          # Bug B: same flag plus `--output-folder-name`, the workaround tried
          # for bug A. 4.3 gives the same plain error as bug A.
          - bug-b
          # Bug C: `--project-name` is the option that error names. It is the
          # one pairing that builds, on 4.2 and on 4.3.
          - bug-c
          # Bug D: `--project` together with `--main-entry-point`, which 4.3
          # still refuses: under `--project` the entry points come from the
          # project configuration.
          - bug-d
          # Baseline: positional package + `--python-flag=-m` builds and runs.
          - baseline
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      BIN_EXT: ${{ contains(matrix.os, 'windows') && '.exe' || '.bin' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.13"
      - name: Setup venv
        run: |
          uv --no-progress venv --python 3.13.13
      - name: Install Nuitka
        run: >
          uv --no-progress pip install --exclude-newer-package nuitka=P0D
          "Nuitka[onefile]==4.3" "uv_build==0.11.13"
      - name: nuitka --version
        run: |
          uv --no-progress run -- python -m nuitka --version

      # Bug A: expected to FAIL with:
      #   FATAL: Error, '--main-entry-point' requires a project name, use
      #   '--project-name=NAME' to specify it.
      # 4.2 raised a `TypeError` traceback from
      # `OutputDirectories._getResultBaseName` at this point.
      - name: "Bug A: --main-entry-point alone"
        if: matrix.variant == 'bug-a'
        run: >
          uv --no-progress run -- python -m nuitka
          --mode=onefile --assume-yes-for-downloads
          --output-filename="cli${BIN_EXT}"
          --main-entry-point=cli=cli.cli_code:my_cli

      # Bug B: expected to FAIL with the same error as bug A. The 4.2 message
      # pointed at `--project` and at running from a project directory. The
      # checkout root holds a 'pyproject.toml' with a `[project] name`, and
      # bug D shows `--project` is refused, so neither remedy applied.
      - name: "Bug B: --main-entry-point + --output-folder-name workaround"
        if: matrix.variant == 'bug-b'
        run: >
          uv --no-progress run -- python -m nuitka
          --mode=onefile --assume-yes-for-downloads
          --output-filename="cli${BIN_EXT}"
          --output-folder-name=cli-bug-b
          --main-entry-point=cli=cli.cli_code:my_cli

      # Bug C: expected to SUCCEED. `--project-name` supplies the name bugs A
      # and B ask for. The option is still absent from `--help`.
      - name: "Bug C: --main-entry-point + --project-name"
        if: matrix.variant == 'bug-c'
        run: >
          uv --no-progress run -- python -m nuitka
          --mode=onefile --assume-yes-for-downloads
          --output-filename="cli${BIN_EXT}"
          --project-name=cli
          --main-entry-point=cli=cli.cli_code:my_cli

      # Bug D: expected to FAIL with:
      #   FATAL: Error, with '--project' do not provide '--main',
      #   '--main-entry-point', or a positional main program. The entry
      #   points need to come from the project configuration.
      # The 4.2 message of bug B recommended this pairing.
      - name: "Bug D: --main-entry-point + --project"
        if: matrix.variant == 'bug-d'
        run: >
          uv --no-progress run -- python -m nuitka
          --mode=onefile --assume-yes-for-downloads
          --output-filename="cli${BIN_EXT}"
          --project
          --main-entry-point=cli=cli.cli_code:my_cli

      # Baseline — expected to SUCCEED. The legacy positional-package +
      # `--python-flag=-m` invocation builds a working binary.
      - name: "Baseline: positional package + --python-flag=-m"
        if: matrix.variant == 'baseline'
        run: >
          uv --no-progress run -- python -m nuitka
          --mode=onefile --assume-yes-for-downloads
          --output-filename="cli${BIN_EXT}"
          --python-flag=-m cli

      # Any variant may emit a crash report; preserve it for inspection.
      - name: Upload Nuitka crash report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nuitka-crash-report-${{ matrix.variant }}-${{ matrix.os }}
          if-no-files-found: ignore
          path: nuitka-crash-report.xml

      - name: Install exiftool - Linux
        if: matrix.variant == 'baseline' && runner.os == 'Linux'
        run: |
          sudo apt --quiet --yes install exiftool
      - name: Install exiftool - macOS
        if: matrix.variant == 'baseline' && runner.os == 'macOS'
        run: |
          brew install exiftool
      - name: Install exiftool - Windows
        if: matrix.variant == 'baseline' && runner.os == 'Windows'
        run: |
          choco install exiftool --no-progress --yes
      - name: Baseline binary metadata
        # Ubuntu:
        #   CPU Type      : Arm 64-bits (Armv8/AArch64)
        #   CPU Type      : AMD x86-64
        # macOS:
        #   CPU Type      : ARM 64-bit
        #   CPU Type      : x86 64-bit
        # Windows
        #   Machine Type  : ARM64 little endian
        #   Machine Type  : AMD AMD64
        if: matrix.variant == 'baseline'
        run: |
          exiftool${{ runner.os == 'Windows' && '.exe' || '' }} "cli${BIN_EXT}"
      - name: Set binary permissions
        if: (matrix.variant == 'baseline' || matrix.variant == 'bug-c') && runner.os != 'Windows'
        run: |
          chmod +x "cli${BIN_EXT}"
      - name: Run binary
        if: matrix.variant == 'baseline' || matrix.variant == 'bug-c'
        run: |
          "./cli${BIN_EXT}"
