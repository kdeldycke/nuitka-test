---
# TEMPORARY probe workflow, to be deleted once the cause of the cold canary
# build of kdeldycke/repomatic on Nuitka 4.3 is known.
#
# The first canary build that followed the move to Nuitka 4.3 restored the
# compile cache of the build before it and still missed every C file. A re-run
# of the same commit on another machine hit 511 files of 512. So either the
# first build of a Nuitka release differs from the later ones, or a source
# change now invalidates every object.
#
# Three builds of the repomatic binary run in one job here, so the machine and
# every install path stay the same. Build 2 repeats build 1 with nothing
# changed. Build 3 follows a one-line edit of one module.
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/ccache-rebuild-probe.yaml
  workflow_dispatch:

env:
  # Hold every install to the cooldown. Nuitka 4.3 is younger than the window,
  # and repomatic's own `pyproject.toml` carries the exemption for it.
  UV_EXCLUDE_NEWER: "1 week"
  # The repomatic commit of the canary build that missed.
  REPOMATIC_REF: 1db4858b3ce0984085e33480d9d061aa3c4cd6a0

jobs:

  rebuilds:
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          # The invocation repomatic moved to with Nuitka 4.3.
          - entry-point
          # The invocation it used on 4.2.2. It is the control: a result both
          # variants share does not come from `--main-entry-point`.
          - positional
    runs-on: ubuntu-26.04-arm
    # The image and the settings of repomatic's own linux-arm64 compile job.
    container: "quay.io/pypa/manylinux_2_28_aarch64\
      @sha256:e7035406e58d96b7407246af1f6514a3cbd753a0025b42b9adfbeadd3b29ba80"
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CCACHE_DIR: ${{ github.workspace }}/.nuitka-cache/ccache
      CCACHE_COMPILERCHECK: content
      VARIANT: ${{ matrix.variant }}
      # The checkout is not owned by the user the container runs as.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kdeldycke/repomatic
          ref: ${{ env.REPOMATIC_REF }}
      # No uv cache is restored or saved: every build of this job then reads
      # Nuitka from the one environment the first build creates.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install ccache in container
        run: |
          dnf install --assumeyes --quiet epel-release
          dnf install --assumeyes --quiet ccache
          ccache --version | head -1
      - name: Prepare Nuitka cache
        run: |
          mkdir -p .nuitka-cache/ccache
          printf 'compiler_check = content\n' > .nuitka-cache/ccache/ccache.conf
          printf 'base_dir = %s\n' "$(dirname "${RUNNER_WORKSPACE}")" \
            >> .nuitka-cache/ccache/ccache.conf
      - name: Setup venv
        run: uv --no-progress --managed-python venv --python 3.14
      - name: Pre-bake build metadata
        run: uvx --no-progress 'click-extra==9.4.1' prebake all

      # No `-e`: a build that fails must still print its log and let the
      # next build run.
      - name: Build three times
        shell: bash {0}
        run: |
          build() {
            rm -rf repomatic.build repomatic.dist repomatic.onefile-build repomatic-probe.bin
            echo "::group::build $1"
            if [[ "${VARIANT}" == "entry-point" ]]; then
              uv --no-progress run --frozen -- repomatic run nuitka -- \
                --project-name=repomatic \
                --main-entry-point=repomatic=repomatic.__main__:main \
                --output-filename=repomatic-probe.bin > "build-$1.log" 2>&1
            else
              uv --no-progress run --frozen -- repomatic run nuitka -- \
                --python-flag=-m \
                --output-filename=repomatic-probe.bin repomatic > "build-$1.log" 2>&1
            fi
            echo "exit code: $?"
            tail -n 12 "build-$1.log"
            echo "::endgroup::"
            echo "build $1:"
            grep -E "Version '|Cached C files" "build-$1.log" || echo "  no ccache result line"
            du -sm .nuitka-cache/* | sed 's/^/  /'
          }
          # Cold: the compile cache and Nuitka's own module cache are empty.
          build 1
          # Nothing changed: same sources, same paths, warm caches.
          build 2
          # One module gains one line, as an ordinary commit does.
          printf '\nPROBE_MARKER = "papaya"\n' >> repomatic/docs.py
          build 3

      - name: "Gate: a rebuild hits the cache"
        if: always()
        run: |
          uv --no-progress run --frozen --no-sync -- python - <<'PY'
          import re
          import sys
          from pathlib import Path

          def counts(number):
              """Hits and misses of the main compilation, the first pair in the log."""
              log = Path(f"build-{number}.log")
              if not log.is_file():
                  return None, None
              text = log.read_text(encoding="UTF-8", errors="replace")
              hit = re.search(r"result 'cache hit': (\d+)", text)
              miss = re.search(r"result 'cache miss': (\d+)", text)
              return int(hit[1]) if hit else 0, int(miss[1]) if miss else 0

          rows = {number: counts(number) for number in (1, 2, 3)}
          labels = {1: "cold", 2: "nothing changed", 3: "one module edited"}
          for number, (hit, miss) in rows.items():
              print(f"build {number} ({labels[number]}): {hit} hit(s), {miss} miss(es)")
          sys.stdout.flush()

          problems = []
          if rows[1][1] is None or rows[1][1] < 400:
              problems.append("build 1 did not compile the program cold, so the test is void")
          for number in (2, 3):
              hit, _ = rows[number]
              if hit is None or hit < 400:
                  problems.append(f"build {number} ({labels[number]}) hit {hit} file(s)")
          for problem in problems:
              print(f"  {problem}")
          sys.stdout.flush()
          if problems:
              sys.exit(1)
          print("\nBoth rebuilds hit the cache.")
          PY
