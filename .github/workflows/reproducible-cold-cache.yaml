---
"on":
  push:
    branches:
      - main
  workflow_dispatch:

# Reproduce https://github.com/Nuitka/Nuitka/issues/3998

jobs:

  reproducible-cold-cache:
    name: cold then warm rebuilds / ${{ matrix.nuitka.label }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26          # arm64
          - macos-26-intel    # x86
          - ubuntu-24.04      # x86, control: same question, different linker
        nuitka:
          # Current stable release. The bug report was written against 4.1.3,
          # and 4.2 behaves the same way.
          - label: "4.2.2"
            spec: "nuitka==4.2.2"
          # Bleeding-edge branch, which carries the upstream fix:
          # https://github.com/Nuitka/Nuitka/commit/0523b1accc5a7758ff1e3ef5869d7dbca05728e1
          - label: "factory"
            spec: "Nuitka @ git+https://github.com/Nuitka/Nuitka.git@factory"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.13"
      - name: Setup venv
        run: |
          uv --no-progress venv --python 3.14
      - name: Install Nuitka
        run: |
          uv --no-progress pip install "${{ matrix.nuitka.spec }}"
      - name: nuitka --version
        run: |
          uv --no-progress run -- python -m nuitka --version

      - name: Create the reproducer
        run: |
          printf 'print("hello world")\n' > hello.py

      # Every build runs in the same directory with the same flags, so no path
      # difference can enter the comparison: the build tree is wiped between
      # builds, not relocated. Build #0 additionally starts from a deleted
      # Nuitka cache, which is the cold-cache case under question.
      - name: Build repeatedly and compare
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/nuitka-cache
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          NUITKA = ["uv", "--no-progress", "run", "--", "python", "-m", "nuitka"]
          FLAGS = [
              "--mode=standalone",
              "--disable-ccache",
              "--assume-yes-for-downloads",
              "--reproducible=yes",
              "hello.py",
          ]
          # Standalone mode names the binary hello.bin off Windows, hello.exe on it.
          BINARIES = ("hello.bin", "hello.exe", "hello")
          BUILDS = 3
          # What Nuitka writes into the build tree for the compiler to read. The
          # tree also holds scons logs, debug scripts and the .sconsign database,
          # which record paths and times, so they stay out of the comparison.
          GENERATED = {".c", ".h", ".const", ".bin"}


          def fail(message):
              """Report a verdict on stdout, so it lands after the evidence it refers to.

              `sys.exit(message)` writes to stderr, which the Actions log interleaves
              ahead of buffered stdout, putting the conclusion before its own reasons.
              """
              print(message)
              sys.stdout.flush()
              sys.exit(1)


          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def build(number):
              if number == 0:
                  shutil.rmtree(os.environ["NUITKA_CACHE_DIR"], ignore_errors=True)
              for leftover in ("hello.build", "hello.dist"):
                  shutil.rmtree(leftover, ignore_errors=True)

              print(f"::group::build #{number}")
              sys.stdout.flush()
              subprocess.run(NUITKA + FLAGS, check=True)
              print("::endgroup::")

              # Kept per build so a varying file can be read against its
              # counterparts from the other builds.
              shutil.copytree("hello.build", f"build-{number}")

              tree = Path("hello.build")
              files = {str(path.relative_to(tree)): path for path in tree.rglob("*") if path.is_file()}
              binaries = [Path("hello.dist") / name for name in BINARIES]
              return {
                  "sources": {name: digest(path) for name, path in files.items() if path.suffix in GENERATED},
                  "objects": {name: digest(path) for name, path in files.items() if path.suffix == ".o"},
                  "binary": {path.name: digest(path) for path in binaries if path.exists()},
              }


          def compare(category):
              """Print one row per file of the category, and return the files that vary."""
              varying = []
              for name in sorted(set().union(*(manifest[category] for manifest in builds))):
                  values = [manifest[category].get(name, "absent")[:12] for manifest in builds]
                  stable = len(set(values)) == 1
                  if not stable:
                      varying.append(name)
                  print(f"{'STABLE ' if stable else 'VARIES '} {name}: {' '.join(values)}")
              return varying


          builds = [build(number) for number in range(BUILDS)]

          # ccache folds the current date into the hash of any source using a
          # time macro unless sloppiness=time_macros says otherwise, and it
          # does so even under SOURCE_DATE_EPOCH (which reproducible mode sets
          # to 0), because it cannot know the compiler honours it. So whether
          # that sloppiness value buys anything at all comes down to whether
          # the compiled tree uses those macros in the first place.
          macros = ("__DATE__", "__TIME__", "__TIMESTAMP__")
          users = [
              str(source)
              for source in sorted(Path("hello.build").rglob("*"))
              if source.suffix in {".c", ".h"}
              and any(macro in source.read_text(encoding="UTF-8", errors="replace") for macro in macros)
          ]
          print(f"\nsources using a time macro: {len(users)}")
          for source in users[:20]:
              print(f"  {source}")

          print(f"\ndigests over {BUILDS} builds (build #0 = cold Nuitka cache)")
          print("\ngenerated sources")
          sources = compare("sources")
          print("\nobject files")
          objects = compare("objects")
          print("\nlinked binary")
          binary = compare("binary")
          sys.stdout.flush()

          # The verdict looks at what Nuitka writes and at what ships: the
          # generated sources and the linked binary. Object files are shown to
          # help locate a difference, and never decide it. Under LTO, gcc gives
          # the sections of each object a random name suffix unless it gets
          # -frandom-seed, which Nuitka does not pass, so on Linux every object
          # differs between builds even when its sources and the binary match.
          if sources:
              fail(f"\n{len(sources)} generated source(s) vary across identical builds.")
          if binary:
              fail("\nThe generated sources match, but the linked binary varies (compiler, linker or signing).")
          if objects:
              print(
                  f"\nThe binary and every generated source match. The {len(objects)} varying "
                  "object file(s) are compiler noise."
              )
          else:
              print("\nIdentical: every generated source, object file and the final binary match byte for byte.")
          PY

      - name: Upload the build trees
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: builds-${{ matrix.nuitka.label }}-${{ matrix.os }}
          if-no-files-found: ignore
          path: build-*

  sloppiness-override:
    name: user CCACHE_SLOPPINESS is overwritten / ${{ matrix.nuitka.label }}
    strategy:
      fail-fast: false
      matrix:
        nuitka:
          - label: "4.2.2"
            spec: "nuitka==4.2.2"
          - label: "factory"
            spec: "Nuitka @ git+https://github.com/Nuitka/Nuitka.git@factory"
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      # The value under test. Anything the user sets here is expected to reach
      # ccache; what reaches it on 4.2.2 is Nuitka's own pair of include_file
      # entries, with this one dropped.
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.13"
      - name: Setup venv
        run: |
          uv --no-progress venv --python 3.14
      - name: Install Nuitka
        run: |
          uv --no-progress pip install "${{ matrix.nuitka.spec }}"

      - name: Create the reproducer
        run: |
          printf 'print("hello world")\n' > hello.py
      - name: Show what the user set
        run: |
          echo "CCACHE_SLOPPINESS=${CCACHE_SLOPPINESS}"

      # ccache is left enabled here, and enableCcache() points CCACHE_LOGFILE
      # at hello.build/ccache-{pid}.txt, whose header prints the configuration
      # ccache actually ran with, and where each setting came from.
      - name: Build with ccache
        run: >
          uv --no-progress run -- python -m nuitka
          --mode=standalone --assume-yes-for-downloads
          hello.py

      - name: Read the effective sloppiness out of the ccache log
        if: always()
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          logs = sorted(Path("hello.build").glob("ccache-*.txt"))
          if not logs:
              sys.exit("No ccache log: the compiler wrapper never ran, so the test is void.")

          lines = [
              line.strip()
              for log in logs
              for line in log.read_text(encoding="UTF-8", errors="replace").splitlines()
              if "sloppiness" in line
          ]
          for line in dict.fromkeys(lines):
              print(line)

          sys.stdout.flush()
          if not any("time_macros" in line for line in lines):
              sys.exit("\nThe exported CCACHE_SLOPPINESS never reached ccache.")
          print("\nThe exported CCACHE_SLOPPINESS reached ccache.")
          PY
