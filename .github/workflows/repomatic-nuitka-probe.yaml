---
# TEMPORARY probe workflow, to be deleted once Nuitka 4.3.1 is qualified for
# kdeldycke/repomatic.
#
# repomatic compiles its own binary with Nuitka on six targets. This probe
# builds that binary with the change that moves the Nuitka pin to 4.3.1,
# before that change reaches repomatic's own release pipeline.
#
# `repomatic-nuitka-4.3.1.patch` holds the change. Each job applies it to the
# repomatic commit named below, then runs the steps of the `compile-binaries`
# job of repomatic's `_release-engine.yaml`.
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/repomatic-nuitka-probe.yaml
      - repomatic-nuitka-4.3.1.patch
  workflow_dispatch:

env:
  # Hold every install to the cooldown. Nuitka 4.3.1 is younger than the
  # window: the build reaches it through the dated `exclude-newer-package`
  # entry the patch adds to repomatic's `pyproject.toml`.
  UV_EXCLUDE_NEWER: "1 week"
  # The repomatic commit the patch was cut from.
  REPOMATIC_REF: 3b9aa5b041aa6ea0050129e849379ad1bbee6294

jobs:

  # The question: does the patched repomatic build a working binary on every
  # release target?
  build:
    name: build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Copied from `NUITKA_BUILD_TARGETS` in repomatic/release/binary.py.
        include:
          - target: linux-arm64
            os: ubuntu-26.04-arm
            platform_id: linux
            extension: bin
            container: "quay.io/pypa/manylinux_2_28_aarch64\
              @sha256:e7035406e58d96b7407246af1f6514a3cbd753a0025b42b9adfbeadd3b29ba80"
          - target: linux-x64
            os: ubuntu-26.04
            platform_id: linux
            extension: bin
            container: "quay.io/pypa/manylinux_2_28_x86_64\
              @sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8"
          - target: macos-arm64
            os: macos-26
            platform_id: macos
            extension: bin
            floor: "11.0"
          - target: macos-x64
            os: macos-26-intel
            platform_id: macos
            extension: bin
            floor: "10.15"
          - target: windows-arm64
            os: windows-11-arm
            platform_id: windows
            extension: exe
          - target: windows-x64
            os: windows-2025
            platform_id: windows
            extension: exe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: repomatic
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CCACHE_DIR: ${{ github.workspace }}/.nuitka-cache/ccache
      CCACHE_COMPILERCHECK: content
      BIN_NAME: repomatic-probe-${{ matrix.target }}.${{ matrix.extension }}
      # The repomatic checkout is not owned by the user the container runs as.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kdeldycke/repomatic
          ref: ${{ env.REPOMATIC_REF }}
          path: repomatic
      # The patch is read out of the object store, not from the working tree:
      # a Windows checkout rewrites the line endings of the working-tree copy.
      - name: Apply the candidate change
        run: git -C .. show HEAD:repomatic-nuitka-4.3.1.patch | git apply --verbose
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
      # No compile cache is restored: repomatic's caches belong to its own
      # repository, so every build here is cold. The ccache settings are the
      # same lines as the `Prepare Nuitka cache` step of the release workflow.
      - name: Prepare Nuitka cache
        if: matrix.platform_id != 'macos'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .nuitka-cache/ccache
          printf 'compiler_check = content\n' > .nuitka-cache/ccache/ccache.conf
          printf 'base_dir = %s\n' "$(dirname "${RUNNER_WORKSPACE}")" \
            >> .nuitka-cache/ccache/ccache.conf
          cat .nuitka-cache/ccache/ccache.conf
      - name: Install ccache in container
        if: matrix.container
        run: >
          (dnf install --assumeyes --quiet epel-release
          && dnf install --assumeyes --quiet ccache)
          || echo "ccache unavailable, building uncached."
      - name: Setup venv
        run: uv --no-progress --managed-python venv --python 3.14
      # The release workflow runs this step on `.dev` versions only, and the
      # repomatic commit above carries one.
      - name: Pre-bake build metadata
        run: uvx --no-progress 'click-extra==9.4.1' prebake all

      - name: Build binary
        env:
          NUITKA_CCACHE_FLAG: >-
            ${{ matrix.platform_id == 'macos' && '--disable-ccache' || '' }}
          MACOSX_DEPLOYMENT_TARGET: >-
            ${{ matrix.platform_id == 'macos' && matrix.floor || '' }}
        run: |
          set -o pipefail
          # NUITKA_CCACHE_FLAG holds an optional flag, meant to word-split.
          # shellcheck disable=SC2086
          uv --no-progress run --frozen -- repomatic --verbosity INFO run nuitka -- \
            ${NUITKA_CCACHE_FLAG} \
            --project-name=repomatic \
            --main-entry-point=repomatic=repomatic.__main__:main \
            --output-filename="${BIN_NAME}" 2>&1 | tee build.log
      - name: Upload Nuitka crash report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nuitka-crash-report-${{ matrix.target }}
          if-no-files-found: ignore
          path: repomatic/nuitka-crash-report.xml
      - name: Nuitka cache stats
        if: always()
        working-directory: ${{ github.workspace }}
        run: du -sm .nuitka-cache/* 2>/dev/null || echo "No Nuitka cache dir."

      # The patch moves the pin from 4.3 to 4.3.1. The claim is read off the
      # banner Nuitka prints, so a build that ran the old pin cannot pass.
      - name: "Gate: the patched tool runner drove Nuitka 4.3.1"
        run: |
          grep -- "Version '4.3.1' on Python 3.14" build.log || {
            echo "The build log does not show Nuitka 4.3.1."
            exit 1
          }

      - name: Verify binary architecture and OS floor
        env:
          TARGET: ${{ matrix.target }}
        run: >
          uv --no-progress run --frozen -- repomatic
          verify-binary --target "${TARGET}" --binary "${BIN_NAME}"
      - name: "Gate: the binary starts and reports its own name"
        run: |
          "./${BIN_NAME}" --version | tee version.txt
          grep -q "^repomatic, version 8\." version.txt
      - name: Self-test binary
        env:
          PYTHONIOENCODING: utf8
        run: >
          uv --no-progress run --frozen --
          click-extra test-suite
          --binary "./${BIN_NAME}"
          --jobs max
